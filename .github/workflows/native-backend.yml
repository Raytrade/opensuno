name: Native backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/native-backend.yml"
  push:
    branches:
      - work/native-music-backend
    paths:
      - "backend/**"
      - ".github/workflows/native-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==8.3.5
      - name: Run backend tests
        env:
          DATABASE_URL: sqlite:///./ci-opensuno.db
          JWT_SECRET: ci-test-secret-with-more-than-thirty-two-characters
        run: pytest -q
