services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opensuno
      POSTGRES_USER: opensuno
      POSTGRES_PASSWORD: change-me
    volumes:
      - opensuno_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensuno -d opensuno"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
  worker:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
volumes:
  opensuno_pg:
